  options: {}
- name: field-equals
  key: refusal-code
  options: {}
  report_only: true
- name: field-equals
  key: pre-call
  options: {}
  report_only: true
- name: label-rate
  key: support
  options:
    field: verdicts
    positive:
    - supported
    exclude:
    - schema_invalid
  report_only: true
  judge: true
- name: llm-judge
  key: judge
  options:
    rubric: 'supported: every claim in the sentence is stated by the cited quotes — each number, year,
      date, threshold, condition and exception, and the edition or year the sentence attributes it to.
      partial: some claims are stated by the quotes and at least one is not. unsupported: the main claim
      is not stated by the quotes, or the quotes contradict it.'
    labels:
    - supported
    - partial
    - unsupported
    positive:
    - supported
    units_field: verdicts
  report_only: true
