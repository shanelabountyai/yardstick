# Gate over footnote-golden-judged (Phase 3): Footnote's own targets, with its sentence judge as llm-judge.
# YS-05: the judge rule gates only if the judge's pooled kappa against Shane's grades is >= kappa_floor.
# Footnote's Opus judge has kappa 0.17 (n 40), so rate:judge is report-only here, whatever its value.
min_items: 8
judge:
  kappa_floor: 0.6
  calibrations:
    - ../footnote/judge/calibration-opus-1646.json
rules:
  # Answered or partial on answerable questions (A, M) >= 90%.
  - metric: rate:refusal
    slice: A+M
    floor: 0.90
  # Refusal on unanswerable questions (U) >= 90%.
  - metric: pass_rate
    slice: U
    floor: 0.90
  # Sentence support by the judge on A, M, V >= 90%: report-only until the judge is calibrated.
  - metric: rate:judge
    slice: A+M+V
    floor: 0.90
