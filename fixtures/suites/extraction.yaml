# Synthetic extraction suite for Yardstick Phase 1. Invented invoices; no real data.
name: extraction
description: Extract vendor, invoice number, currency and total from invoice text as JSON.
scorers:
  - name: json-schema
  - name: regex
    key: invoice-number
    options: {ignore_case: false}
  - name: numeric-tolerance
    key: total
    options: {field: total, abs_tol: 0.01}
items:
  - id: inv-001
    slices: [simple]
    input: {text: "INVOICE NW-1001\nFrom: Northwind Traders\nAmount due: 1,250.00 USD"}
    expected:
      json-schema: {"type": "object", "required": ["vendor", "invoice_number", "currency", "total"], "properties": {"vendor": {"type": "string", "minLength": 1}, "invoice_number": {"type": "string"}, "currency": {"type": "string", "enum": ["USD", "EUR", "GBP"]}, "total": {"type": "number", "minimum": 0}}, "additionalProperties": false}
      invoice-number: '"invoice_number":"NW-1001"'
      total: 1250.0
  - id: inv-002
    slices: [simple]
    input: {text: "INVOICE CT-0042\nFrom: Contoso Ltd\nAmount due: 89.90 EUR"}
    expected:
